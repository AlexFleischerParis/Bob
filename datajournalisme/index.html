<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prix carburants par département</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#1a1a2e;color:#eee;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#16213e;border-bottom:1px solid #0f3460;flex-shrink:0;flex-wrap:wrap}
#header h1{font-size:14px;font-weight:600;color:#e94560;white-space:nowrap}
#fuel-tabs{display:flex;gap:4px;flex-wrap:wrap}
.ftab{padding:4px 10px;border-radius:12px;border:1px solid #0f3460;background:transparent;color:#aaa;font-size:12px;cursor:pointer;white-space:nowrap}
.ftab.active{background:#e94560;border-color:#e94560;color:#fff}
#live-btn{margin-left:auto;padding:4px 10px;border-radius:12px;border:1px solid #0f3460;background:transparent;color:#aaa;font-size:12px;cursor:pointer;white-space:nowrap}
#live-btn:hover{border-color:#e94560;color:#e94560}
#ts{font-size:10px;color:#666;white-space:nowrap}
#main{flex:1;display:flex;overflow:hidden;position:relative}
#map-wrap{flex:1;position:relative;overflow:hidden}
svg#map{width:100%;height:100%;display:block}
.dept{stroke:#1a1a2e;stroke-width:0.5;cursor:pointer;transition:opacity .15s}
.dept:hover{opacity:.75;stroke-width:1.5;stroke:#fff}
.dept.selected{stroke:#fff;stroke-width:2}
#panel{position:absolute;bottom:0;left:0;right:0;background:#16213e;border-top:2px solid #e94560;padding:12px 16px;transform:translateY(100%);transition:transform .3s ease;z-index:10;max-height:55%;overflow-y:auto}
#panel.open{transform:translateY(0)}
#panel-handle{width:36px;height:4px;background:#555;border-radius:2px;margin:0 auto 10px;cursor:pointer}
#panel-name{font-size:16px;font-weight:700;color:#e94560;margin-bottom:8px}
#panel-prices{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.price-row{background:#0f3460;border-radius:6px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center}
.price-label{font-size:11px;color:#aaa}
.price-val{font-size:14px;font-weight:700;color:#fff}
.price-val.cheap{color:#4ecca3}
.price-val.exp{color:#e94560}
#sidebar{width:220px;background:#16213e;border-left:1px solid #0f3460;padding:12px;overflow-y:auto;flex-shrink:0}
#sidebar h2{font-size:12px;color:#aaa;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;color:#ccc}
.legend-swatch{width:16px;height:12px;border-radius:2px;flex-shrink:0}
#ranking{margin-top:14px}
#ranking h2{font-size:12px;color:#aaa;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.rank-row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #0f3460;cursor:pointer;font-size:11px}
.rank-row:hover .rank-name{color:#e94560}
.rank-num{width:18px;color:#666;text-align:right;flex-shrink:0}
.rank-name{flex:1;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-val{color:#fff;font-weight:600;flex-shrink:0}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#16213e;color:#aaa;padding:16px 24px;border-radius:8px;border:1px solid #0f3460;font-size:14px;pointer-events:none;z-index:30;text-align:center;white-space:pre-line;max-width:320px;line-height:1.6}
#tooltip{position:absolute;pointer-events:none;background:#16213e;border:1px solid #e94560;border-radius:6px;padding:6px 10px;font-size:12px;display:none;z-index:20;max-width:180px;line-height:1.4}
#tooltip b{color:#e94560;display:block;margin-bottom:2px}
@media(max-width:640px){
  #sidebar{display:none}
  #panel{display:block}
}
@media(min-width:641px){
  #panel{display:none!important}
}
</style>
</head>
<body>
<div id="header">
  <h1>&#9981; Prix carburants / département</h1>
  <div id="fuel-tabs">
    <button class="ftab active" data-fuel="g">Gazole</button>
    <button class="ftab" data-fuel="s5">SP95</button>
    <button class="ftab" data-fuel="s8">SP98</button>
    <button class="ftab" data-fuel="e">E10</button>
  </div>
  <button id="live-btn">&#8635; Live</button>
  <span id="ts"></span>
</div>
<div id="main">
  <div id="map-wrap">
    <svg id="map"></svg>
    <div id="tooltip"></div>
    <div id="loading">Chargement des prix en cours&hellip;</div>
  </div>
  <div id="sidebar">
    <h2>Légende</h2>
    <div id="legend-items"></div>
    <div id="ranking">
      <h2>Classement</h2>
      <div id="rank-list"></div>
    </div>
  </div>
  <div id="panel">
    <div id="panel-handle" onclick="document.getElementById('panel').classList.remove('open')"></div>
    <div id="panel-name">—</div>
    <div id="panel-prices"></div>
  </div>
</div>

const FUELS={g:"Gazole",s5:"SP95",s8:"SP98",e:"E10"};
const COLORS=["#2c7bb6","#74add1","#abd9e9","#ffffbf","#fee090","#fdae61","#f46d43","#d73027"];
let currentFuel="g";
let deptData={};
let geoFeatures=[];
let selCode=null;

function fmtPrice(v){return v==null?"N/D":v.toFixed(3)+" \u20ac";}

function colorScale(val,mn,mx){
  if(val==null)return"#333";
  const t=Math.max(0,Math.min(1,(val-mn)/(mx-mn)));
  const i=Math.floor(t*(COLORS.length-1));
  const j=Math.min(i+1,COLORS.length-1);
  const frac=t*(COLORS.length-1)-i;
  const c1=hexRgb(COLORS[i]),c2=hexRgb(COLORS[j]);
  return"rgb("+Math.round(c1[0]+(c2[0]-c1[0])*frac)+","+Math.round(c1[1]+(c2[1]-c1[1])*frac)+","+Math.round(c1[2]+(c2[2]-c1[2])*frac)+")";
}
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

// Lambert-93 conic conformal projection
const DEG=Math.PI/180;
const phi1=44*DEG,phi2=49*DEG,phi0=46.5*DEG,lam0=3*DEG;
const a=6378137,e2=0.00669438003,e=Math.sqrt(e2);
function mF(phi){const sp=Math.sin(phi);return Math.cos(phi)/Math.sqrt(1-e2*sp*sp);}
function tF(phi){const sp=Math.sin(phi);return Math.tan(Math.PI/4-phi/2)/Math.pow((1-e*sp)/(1+e*sp),e/2);}
const m1=mF(phi1),m2=mF(phi2),t1=tF(phi1),t2=tF(phi2),t0=tF(phi0);
const n=Math.log(m1/m2)/Math.log(t1/t2);
const F=m1/(n*Math.pow(t1,n));
const rho0=a*F*Math.pow(t0,n);
function project(lon,lat){
  const lam=lon*DEG,phi=lat*DEG,t=tF(phi),rho=a*F*Math.pow(t,n),theta=n*(lam-lam0);
  return[rho*Math.sin(theta)+700000, rho0-rho*Math.cos(theta)+6600000];
}

let _bounds=null;
function getBounds(features){
  if(_bounds)return _bounds;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  function ring(r){r.forEach(c=>{const[x,y]=project(c[0],c[1]);if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;});}
  features.forEach(f=>{const g=f.geometry;if(!g)return;
    if(g.type==="Polygon")g.coordinates.forEach(ring);
    else if(g.type==="MultiPolygon")g.coordinates.forEach(p=>p.forEach(ring));
  });
  _bounds={x0,x1,y0,y1};
  return _bounds;
}

// Uniform scale: fit bbox into viewport while preserving aspect ratio, centered.
function makeTransform(b,W,H){
  const bw=b.x1-b.x0, bh=b.y1-b.y0;
  const scale=Math.min(W/bw, H/bh)*0.97; // 0.97 = small padding
  const ox=(W-bw*scale)/2;
  const oy=(H-bh*scale)/2;
  return{scale,ox,oy,b};
}

function toSvg(lon,lat,tr){
  const[x,y]=project(lon,lat);
  return[(x-tr.b.x0)*tr.scale+tr.ox, (tr.b.y1-y)*tr.scale+tr.oy];
}

function ringPath(ring,tr){
  if(!ring||ring.length<2)return"";
  return"M"+ring.map(c=>{const[sx,sy]=toSvg(c[0],c[1],tr);return sx.toFixed(1)+","+sy.toFixed(1);}).join("L")+"Z";
}

function geoPath(geo,tr){
  if(!geo)return"";
  if(geo.type==="Polygon")return geo.coordinates.map(r=>ringPath(r,tr)).join(" ");
  if(geo.type==="MultiPolygon")return geo.coordinates.map(p=>p.map(r=>ringPath(r,tr)).join(" ")).join(" ");
  return"";
}

function normCode(c){
  if(!c)return"";
  c=String(c).trim().toUpperCase();
  if(c==="2A"||c==="2B")return c;
  return c.replace(/^0/,"").padStart(2,"0");
}

function getVals(){
  return Object.values(deptData).map(d=>d[currentFuel]).filter(v=>v!=null);
}

function renderMap(){
  const svg=document.getElementById("map");
  const W=svg.clientWidth||800,H=svg.clientHeight||600;
  if(W<10||H<10)return;
  const b=getBounds(geoFeatures);
  const tr=makeTransform(b,W,H);
  const vals=getVals();
  if(!vals.length)return;
  const mn=Math.min(...vals),mx=Math.max(...vals);

  svg.querySelectorAll("path.dept").forEach(p=>p.remove());

  geoFeatures.forEach(f=>{
    const props=f.properties||{};
    const code=normCode(props.code);
    const d=deptData[code];
    const val=d?d[currentFuel]:null;
    const pathStr=geoPath(f.geometry,tr);
    if(!pathStr)return;
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",pathStr);
    path.setAttribute("fill",colorScale(val,mn,mx));
    path.classList.add("dept");
    if(selCode===code)path.classList.add("selected");
    path.dataset.code=code;
    path.dataset.name=props.nom||props.name||code;
    svg.appendChild(path);
    path.addEventListener("click",e=>{
      selCode=code;
      svg.querySelectorAll(".dept").forEach(p=>p.classList.remove("selected"));
      path.classList.add("selected");
      showInfo(code,path.dataset.name,d);
    });
    path.addEventListener("mousemove",e=>showTip(e,path.dataset.name,d));
    path.addEventListener("mouseleave",()=>{document.getElementById("tooltip").style.display="none";});
  });
  renderLegend(mn,mx);
  renderRanking();
}

function showTip(e,name,d){
  const tt=document.getElementById("tooltip");
  const val=d?d[currentFuel]:null;
  tt.innerHTML="<b>"+name+"</b>"+FUELS[currentFuel]+": "+fmtPrice(val);
  tt.style.display="block";
  const wrap=document.getElementById("map-wrap");
  const rect=wrap.getBoundingClientRect();
  let x=e.clientX-rect.left+14,y=e.clientY-rect.top+14;
  if(x+185>wrap.offsetWidth)x=e.clientX-rect.left-195;
  if(y+60>wrap.offsetHeight)y=e.clientY-rect.top-65;
  tt.style.left=x+"px";tt.style.top=y+"px";
}

function showInfo(code,name,d){
  document.getElementById("panel-name").textContent=name||code;
  const grid=document.getElementById("panel-prices");
  grid.innerHTML="";
  Object.entries(FUELS).forEach(([k,label])=>{
    const v=d?d[k]:null;
    const all=Object.values(deptData).map(r=>r[k]).filter(x=>x!=null);
    let cls="";
    if(v!=null&&all.length){
      const med=(Math.min(...all)+Math.max(...all))/2;
      cls=v<med?"cheap":(v>med?"exp":"");
    }
    const div=document.createElement("div");
    div.className="price-row";
    div.innerHTML="<span class='price-label'>"+label+"</span><span class='price-val "+cls+"'>"+fmtPrice(v)+"</span>";
    grid.appendChild(div);
  });
  document.getElementById("panel").classList.add("open");
}

function renderLegend(mn,mx){
  const cont=document.getElementById("legend-items");
  if(!cont)return;
  cont.innerHTML="";
  for(let i=0;i<=5;i++){
    const v=mn+(mx-mn)*i/5;
    const div=document.createElement("div");div.className="legend-item";
    const sw=document.createElement("div");sw.className="legend-swatch";
    sw.style.background=colorScale(v,mn,mx);
    const sp=document.createElement("span");sp.textContent=v.toFixed(3)+" \u20ac";
    div.appendChild(sw);div.appendChild(sp);cont.appendChild(div);
  }
}

function renderRanking(){
  const cont=document.getElementById("rank-list");
  if(!cont)return;
  cont.innerHTML="";
  const sorted=Object.values(deptData).filter(d=>d[currentFuel]!=null).sort((a,b)=>a[currentFuel]-b[currentFuel]);
  sorted.forEach((d,i)=>{
    const div=document.createElement("div");div.className="rank-row";
    div.innerHTML="<span class='rank-num'>"+(i+1)+"</span><span class='rank-name'>"+d.name+"</span><span class='rank-val'>"+d[currentFuel].toFixed(3)+"</span>";
    div.addEventListener("click",()=>{selCode=normCode(d.code);renderMap();showInfo(d.code,d.name,d);});
    cont.appendChild(div);
  });
}

function setTs(ts, live){
  const el=document.getElementById("ts");
  if(!ts){el.textContent=live?"":"Données hors-ligne";return;}
  const dt=new Date(ts);
  const now=new Date();
  // Some stations have future timestamps — cap at now
  const display=dt>now?now:dt;
  const label=display.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  el.textContent=(live?"Màj : ":"Hors-ligne : ")+label;
  if(live)el.style.color="#4ecca3"; else el.style.color="#666";
}

function hideLoading(msg){
  const el=document.getElementById("loading");
  if(!el)return;
  if(msg){el.style.color="#e94560";el.textContent=msg;}
  else el.style.display="none";
}

async function fetchLive(silent){
  const btn=document.getElementById("live-btn");
  if(!silent){btn.textContent="...";btn.disabled=true;}
  try{
    const url="https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records?select=code_departement%2Cdepartement%2Cavg(gazole_prix)%20as%20g%2Cavg(sp95_prix)%20as%20s5%2Cavg(sp98_prix)%20as%20s8%2Cavg(e10_prix)%20as%20e%2Cmax(gazole_maj)%20as%20lu&group_by=code_departement%2Cdepartement&limit=120";
    const r=await fetch(url, {mode:"cors"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    const rows=(j.results||[]).filter(x=>x.code_departement);
    if(!rows.length)throw new Error("Réponse vide");
    rows.forEach(x=>{
      const code=normCode(x.code_departement);
      const entry={code,name:x.departement||x.code_departement,g:x.g!=null?+x.g:null,s5:x.s5!=null?+x.s5:null,s8:x.s8!=null?+x.s8:null,e:x.e!=null?+x.e:null};
      if(deptData[code])Object.assign(deptData[code],entry);
      else deptData[code]=entry;
    });
    const latest=rows.map(x=>x.lu).filter(Boolean).sort().pop();
    setTs(latest, true);
    _bounds=null;
    renderMap();
    hideLoading();
    if(!silent){btn.textContent="\u2713 Live";setTimeout(()=>btn.textContent="\u21bb Live",3000);}
  }catch(err){
    console.error("Live fetch error:",err);
    const msg="Erreur chargement : "+err.message+"\nCliquez \u21bb Live pour r\u00e9essayer.";
    hideLoading(msg);
    setTs(null,false);
    if(!silent){btn.textContent="\u21bb Live";btn.disabled=false;}
  }finally{
    if(!silent)btn.disabled=false;
  }
}

async function decodeGeo(){
  // GEO_B64 is zlib-compressed (header 78 DA). Strip 2-byte zlib header, then deflate-raw.
  const bin=atob(GEO_B64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  // Skip zlib header (2 bytes: 78 DA) and adler32 trailer (4 bytes at end)
  const raw=bytes.slice(2,bytes.length-4);
  const ds=new DecompressionStream("deflate-raw");
  const writer=ds.writable.getWriter();
  writer.write(raw);writer.close();
  const reader=ds.readable.getReader();
  const chunks=[];let total=0;
  while(true){const{done,value}=await reader.read();if(done)break;chunks.push(value);total+=value.length;}
  const all=new Uint8Array(total);let off=0;
  for(const c of chunks){all.set(c,off);off+=c.length;}
  return JSON.parse(new TextDecoder().decode(all));
}

document.querySelectorAll(".ftab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".ftab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentFuel=btn.dataset.fuel;
    renderMap();
  });
});

document.getElementById("map").addEventListener("click",e=>{
  if(e.target.tagName!=="path")document.getElementById("panel").classList.remove("open");
});

setTs(null, false);

decodeGeo().then(geo=>{
  geoFeatures=(geo.features||[]).filter(f=>{
    const c=String(f.properties?.code||"");
    const n=parseInt(c);
    return isNaN(n)?["2A","2B"].includes(c.toUpperCase()):(n>=1&&n<970);
  });
  let raf=null;
  window.addEventListener("resize",()=>{
    _bounds=null;
    if(raf)cancelAnimationFrame(raf);
    raf=requestAnimationFrame(renderMap);
  });
  // Auto-fetch live prices — this will hide the spinner when done (or show error)
  fetchLive(true);
}).catch(err=>{
  console.error("GeoJSON decode failed:",err);
  hideLoading("Erreur carte : "+err.message);
});
